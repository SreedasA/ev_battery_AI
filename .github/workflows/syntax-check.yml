name: Syntax check

on:
  push:
  pull_request:

jobs:
  python-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile Python files
        run: |
          python -m py_compile video_annotator.py
          python -m py_compile app/main.py
          python -m py_compile pseudo_label.py
          python -m py_compile sample_frames.py
          python -m py_compile upload_to_roboflow.py
